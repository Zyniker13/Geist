# Murmuration XcodeGen spec

name: Murmuration
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGNING_ALLOWED: NO

configFiles:
  Debug: Config/Bundle.xcconfig
  Release: Config/Bundle.xcconfig

packages:
  MUCore:
    path: Packages/MUCore
  MUContent:
    path: Packages/MUContent
  MUAI:
    path: Packages/MUAI
  MURender:
    path: Packages/MURender
  MUAudio:
    path: Packages/MUAudio
  MUPlatform:
    path: Packages/MUPlatform
  MUMeta:
    path: Packages/MUMeta

targets:
  MU:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: App/iOS
      - path: App/Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID)
    info:
      path: App/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
    dependencies:
      - package: MUCore
      - package: MUContent
      - package: MUAI
      - package: MURender
      - package: MUAudio
      - package: MUPlatform
      - package: MUMeta

  MU-macOS:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: App/macOS
      - path: App/Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: MUCore
      - package: MUContent
      - package: MUAI
      - package: MURender
      - package: MUAudio
      - package: MUPlatform
      - package: MUMeta

  MUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: Tests/UITests
        excludes:
          - "MUITestsMac.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MU

  MUITestsMac:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: Tests/UITests
        excludes:
          - "MUITests.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID).mac-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MU-macOS
    dependencies:
      - target: MU-macOS

schemes:
  MU:
    build:
      targets:
        MU: all
    test:
      targets:
        - MUITests
  MU-macOS:
    build:
      targets:
        MU-macOS: all
    test:
      targets:
        - MUITestsMac
