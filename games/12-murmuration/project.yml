# Murmuration XcodeGen spec

name: Murmuration
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
  fileExtensions:
    pbxproj: pbxproj

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGNING_ALLOWED: NO

configFiles:
  Debug: Config/Bundle.xcconfig
  Release: Config/Bundle.xcconfig

packages:
  MMCore:
    path: Packages/MMCore
  MMContent:
    path: Packages/MMContent
  MMLogic:
    path: Packages/MMLogic
  MMRender:
    path: Packages/MMRender
  MMPlatform:
    path: Packages/MMPlatform
  MMMeta:
    path: Packages/MMMeta

targets:
  MM:
    type: application
    platform: iOS
    sources:
      - App/iOS
      - App/Shared
      - path: Resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID)
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: App/iOS/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: MMCore
      - package: MMContent
      - package: MMLogic
      - package: MMRender
      - package: MMPlatform

  MM-macOS:
    type: application
    platform: macOS
    sources:
      - App/macOS
      - App/Shared
      - path: Resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID)
    dependencies:
      - package: MMCore
      - package: MMContent
      - package: MMLogic
      - package: MMRender
      - package: MMPlatform
