# Orrery XcodeGen spec

name: Orrery

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGNING_ALLOWED: NO

configFiles:
  Debug: Config/Bundle.xcconfig
  Release: Config/Bundle.xcconfig

packages:
  ORCore:
    path: Packages/ORCore
  ORContent:
    path: Packages/ORContent
  ORAI:
    path: Packages/ORAI
  ORRender:
    path: Packages/ORRender
  ORAudio:
    path: Packages/ORAudio
  ORPlatform:
    path: Packages/ORPlatform
  ORMeta:
    path: Packages/ORMeta

targets:
  OR:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: App/iOS
      - path: App/Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID)
    info:
      path: App/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
    dependencies:
      - package: ORCore
      - package: ORContent
      - package: ORAI
      - package: ORRender
      - package: ORAudio
      - package: ORPlatform
      - package: ORMeta

  OR-macOS:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: App/macOS
      - path: App/Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: ORCore
      - package: ORContent
      - package: ORAI
      - package: ORRender
      - package: ORAudio
      - package: ORPlatform
      - package: ORMeta

  ORUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: Tests/UITests
        excludes:
          - "ORUITestsMac.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OR

  ORUITestsMac:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Config/Bundle.xcconfig
      Release: Config/Bundle.xcconfig
    sources:
      - path: Tests/UITests
        excludes:
          - "ORUITests.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEIST_BUNDLE_ID).mac-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OR-macOS
    dependencies:
      - target: OR-macOS

schemes:
  OR:
    build:
      targets:
        OR: all
    test:
      targets:
        - ORUITests
  OR-macOS:
    build:
      targets:
        OR-macOS: all
    test:
      targets:
        - ORUITestsMac
