# Murmuration CI
name: Murmuration CI

on:
  push:
    branches: [main, 'murmur/**']
    paths:
      - 'games/12-murmuration/**'
      - '.github/workflows/murmuration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/12-murmuration/**'
      - '.github/workflows/murmuration.yml'

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: SwiftLint
        working-directory: games/12-murmuration
        run: swiftlint --strict --config .swiftlint.yml
      - name: swift-format
        working-directory: games/12-murmuration
        run: swift-format lint --recursive Packages/ App/ Tests/ --configuration .swift-format
      - name: content-lint
        working-directory: games/12-murmuration
        run: ./Tools/content-lint
      - name: check-imports
        working-directory: games/12-murmuration
        run: ./Tools/check-imports.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Swift test (Core)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUCore
      - name: Swift test (Content)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUContent
      - name: Swift test (AI)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUAI
      - name: Swift test (Render)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MURender
      - name: Swift test (Audio)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUAudio
      - name: Swift test (Platform)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUPlatform
      - name: Swift test (Meta)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUMeta

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Build iOS
        working-directory: games/12-murmuration
        run: |
          xcodegen generate --spec project.yml
          xcodebuild build -scheme MU -destination 'generic/platform=iOS Simulator' -configuration Debug

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Build macOS
        working-directory: games/12-murmuration
        run: |
          xcodegen generate --spec project.yml
          xcodebuild build -scheme MU-macOS -destination 'platform=macOS' -configuration Debug

  ui-test-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Generate project
        working-directory: games/12-murmuration
        run: xcodegen generate --spec project.yml
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Pick an iPad simulator
        working-directory: games/12-murmuration
        run: |
          UDID=$(xcrun simctl list devices available | grep 'iPad Pro 13-inch' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -i 'iPad' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          fi
          test -n "$UDID" || { echo 'No iPad simulator found on this runner'; exit 1; }
          echo "simUDID=$UDID" >> "$GITHUB_ENV"
      - name: UI test (iOS, iPad simulator)
        working-directory: games/12-murmuration
        # Release: performance gates measure shipped-code speed. A Debug
        # build's bounds-checked kernel is ~80x slower (70 ms/tick at 3,000
        # birds vs 0.9 ms in Release), pegs the main thread, starves the
        # accessibility snapshot, and can never meet the frame budget.
        # One retry: the shared runner's co-tenant load has sunk the fps
        # gate on quiet-code commits (ADR-0016); a real regression fails
        # both attempts deterministically.
        run: |
          st=1
          for attempt in 1 2; do
            echo "=== UI test attempt $attempt ==="
            if xcodebuild test -scheme MU -destination "id=${{ env.simUDID }}" -configuration Release -resultBundlePath "/tmp/mu-g2-ios-$attempt.xcresult"; then
              st=0
              break
            fi
            echo "attempt $attempt failed; retrying once"
          done
          exit $st

      - name: Collect UI-test diagnostics
        if: always()
        run: |
          mkdir -p _mu-g2-diag
          find /tmp -maxdepth 1 -name 'mu-uitest-*' -exec cp -R {} _mu-g2-diag/ \; || true
          find /tmp -maxdepth 1 -name 'mu-g2-ios-*.xcresult' -exec cp -R {} _mu-g2-diag/ \; || true
          ls -la _mu-g2-diag || true

      - name: Upload UI-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mu-g2-diag-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: _mu-g2-diag
          retention-days: 5
          if-no-files-found: ignore

  ui-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Generate project
        working-directory: games/12-murmuration
        run: xcodegen generate --spec project.yml
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: UI test (macOS)
        working-directory: games/12-murmuration
        # One retry, same policy as the iOS job (ADR-0016): a loaded runner
        # can sink the perf gate; a real regression fails both attempts.
        run: |
          st=1
          for attempt in 1 2; do
            echo "=== UI test attempt $attempt ==="
            if xcodebuild test -scheme MU-macOS -destination 'platform=macOS' -configuration Release -resultBundlePath "/tmp/mu-g2-mac-$attempt.xcresult"; then
              st=0
              break
            fi
            echo "attempt $attempt failed; retrying once"
          done
          exit $st

      - name: Collect UI-test diagnostics
        if: always()
        run: |
          mkdir -p _mu-g2-diag
          find /tmp -maxdepth 1 -name 'mu-uitest-*' -exec cp -R {} _mu-g2-diag/ \; || true
          find /tmp -maxdepth 1 -name 'mu-g2-mac-*.xcresult' -exec cp -R {} _mu-g2-diag/ \; || true
          ls -la _mu-g2-diag || true

      - name: Upload UI-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mu-g2-diag-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: _mu-g2-diag
          retention-days: 5
          if-no-files-found: ignore

