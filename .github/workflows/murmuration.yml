# Murmuration CI
name: Murmuration CI

on:
  push:
    branches: [main, 'murmur/**']
    paths:
      - 'games/12-murmuration/**'
      - '.github/workflows/murmuration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/12-murmuration/**'
      - '.github/workflows/murmuration.yml'

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: SwiftLint
        working-directory: games/12-murmuration
        run: swiftlint --strict --config .swiftlint.yml
      - name: swift-format
        working-directory: games/12-murmuration
        run: swift-format lint --recursive Packages/ App/ Tests/ --configuration .swift-format
      - name: content-lint
        working-directory: games/12-murmuration
        run: ./Tools/content-lint
      - name: check-imports
        working-directory: games/12-murmuration
        run: ./Tools/check-imports.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Swift test (Core)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUCore
      - name: Swift test (Content)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUContent
      - name: Swift test (AI)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUAI
      - name: Swift test (Render)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MURender
      - name: Swift test (Audio)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUAudio
      - name: Swift test (Platform)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUPlatform
      - name: Swift test (Meta)
        working-directory: games/12-murmuration
        run: swift test --package-path Packages/MUMeta

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Build iOS
        working-directory: games/12-murmuration
        run: |
          xcodegen generate --spec project.yml
          xcodebuild build -scheme MU -destination 'generic/platform=iOS Simulator' -configuration Debug

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Build macOS
        working-directory: games/12-murmuration
        run: |
          xcodegen generate --spec project.yml
          xcodebuild build -scheme MU-macOS -destination 'platform=macOS' -configuration Debug

  ui-test-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Generate project
        working-directory: games/12-murmuration
        run: xcodegen generate --spec project.yml
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Pick an iPad simulator
        working-directory: games/12-murmuration
        run: |
          UDID=$(xcrun simctl list devices available | grep 'iPad Pro 13-inch' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -i 'iPad' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          fi
          test -n "$UDID" || { echo 'No iPad simulator found on this runner'; exit 1; }
          echo "simUDID=$UDID" >> "$GITHUB_ENV"
      - name: UI test (iOS, iPad simulator)
        working-directory: games/12-murmuration
        run: xcodebuild test -scheme MU -destination "id=${{ env.simUDID }}" -configuration Debug

  ui-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          brew install --overwrite xcodegen swiftlint swift-format 2>/dev/null || true
      - name: Generate project
        working-directory: games/12-murmuration
        run: xcodegen generate --spec project.yml
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: UI test (macOS)
        working-directory: games/12-murmuration
        run: xcodebuild test -scheme MU-macOS -destination 'platform=macOS' -configuration Debug
